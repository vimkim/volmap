[package]
name = "volmap"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[lib]
name = "volmap"
path = "src/lib.rs"

[[bin]]
name = "volmap"
path = "src/main.rs"

[dependencies]
aes = { version = "=0.9.2", features = ["zeroize"] }
aria = { version = "=0.2.0", features = ["zeroize"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
cipher = { version = "=0.5.2", features = ["zeroize"] }
clap = { version = "=4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
if-addrs = "=0.15.0"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode", "safe-encode", "checked-decode"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.53.1", features = ["net", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = { version = "=1.9.0", features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
