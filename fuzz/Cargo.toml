name = "page_envelope"
path = "fuzz_targets/page_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "volume_bitmap"
path = "fuzz_targets/volume_bitmap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slotted_records"
path = "fuzz_targets/slotted_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_pages"
path = "fuzz_targets/metadata_pages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tde_key_info"
path = "fuzz_targets/tde_key_info.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
