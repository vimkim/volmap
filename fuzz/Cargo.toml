edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
volmap = { path = ".." }

[[bin]]
name = "byte_access"
path = "fuzz_targets/byte_access.rs"
